# Local Development Configuration

# Database Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for viewing database in browser at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration - Development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
# Secret is loaded from the gitignored application-secrets.properties.
# Copy application-secrets.properties.example → application-secrets.properties and fill it in.
# In production, set JWT_SECRET as an environment variable instead.
spring.config.import=optional:classpath:application-secrets.properties
jwt-expiration-ms=86400000

# Logging Configuration - Verbose for development
logging.level.assembly.general.api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
